<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro estudiante</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="contenedor">
    <h1> registro de estudiantes</h1>
    <p>complete todos los campos para realizar su registro</p>
    <form id="formulario">

        <div class="grupo">

        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre">
        <small id ="errorNombre"></small>

        <div class="grupo">

        <label for="apellidos">Apellidos: </label>
        <input type="text" id="apellidos">
        <small id ="errorApellidos"></small>

        <div class="grupo">

        <label for="documento">Documento: </label>
        <input type="text" id="documento">
        <small id ="errorDocumento"></small>

        <div class="grupo">

        <label for="correo">Correo electronico: </label>
        <input type="text" id="correo">
        <small id ="errorCorreo"></small>

        <div class="grupo">

        <label for="telefono">Telefono: </label>
        <input type="text" id="telefono">
        <small id ="errorTelefono"></small>

        <div class="grupo">

        <label for="edad">Edad: </label>
        <input type="text" id="edad">
        <small id ="errorEdad"></small>

        <div class="grupo">

        <label for="contrasena">Contaseña: </label>
        <input type="password" id="contrasena">
        <small id ="errorContrasena"></small>

        </div>

        <div class="grupo">

        <label for="confirmar">Confirmar contraseña: </label>
        <input type="password" id="confirmar">
        <small id ="errorConfirmar"></small>

        </div>

        <div class="grupo">

        <label for="programa">Programa de formacion: </label>
        <select id ="programa">
            <option value ="">Seleccione un programa</option>
            <option value ="ADSO">Analisis y desarrollo de sotfware</option>
            <option value ="Multimedia">Produccion Multimedia</option>
            <option value ="Redes">Gestion de Redes</option>
        </select>
        <small id="errorPrograma"></small>

        <div class="grupo">

        <label>
            <input type="checkbox" id ="terminos">
            Acepto los terminos y condiciones
        </label>
        <small id="errorTerminos"></small>
        </div>

        <button type="submit" id="btnRegristar">
            Registrar estudiantes
        </button>
        <p id="mensajeFinal"></p>

        <form id="formulario">
            <button type="submit" id="btnRegristar">Registrar estudiante</button>
            <p id="mensajeFinal"></p>
        </form>




        </select>

    </form>
    </main>
    <script src="js/validaciones.js"></script>
</body>
</html>
